<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Buscador semántico: una pregunta en lenguaje natural devuelve fragmentos de apuntes ordenados por relevancia">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="55%" stop-color="#122036"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="accB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glowB"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgB)"/>

  <!-- nube de vectores de fondo -->
  <g opacity=".35">
    <g fill="#60a5fa">
      <circle cx="640" cy="72" r="3"/><circle cx="694" cy="110" r="2.5"/><circle cx="600" cy="128" r="2.5"/>
      <circle cx="726" cy="66" r="2"/><circle cx="668" cy="150" r="3"/><circle cx="742" cy="140" r="2.5"/>
      <circle cx="612" cy="188" r="2"/><circle cx="702" cy="196" r="2.5"/><circle cx="756" cy="182" r="2"/>
    </g>
    <g stroke="#34d399" stroke-width="1" opacity=".5">
      <path d="M640 72 L694 110 L668 150 L640 72"/><path d="M694 110 L742 140"/><path d="M668 150 L702 196"/>
    </g>
  </g>

  <!-- ═══ BARRA DE BÚSQUEDA ═══ -->
  <g filter="url(#glowB)">
    <rect x="48" y="58" width="600" height="56" rx="28" fill="#161c29" stroke="url(#accB)" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="2.6" fill="none" stroke-linecap="round">
      <circle cx="84" cy="86" r="9"/><path d="M91 93 l8 8"/>
    </g>
    <text x="114" y="93" font-family="system-ui,sans-serif" font-size="18" fill="#eaf0fa">¿cómo evito que el modelo memorice los datos?</text>
    <rect x="592" y="70" width="2" height="32" fill="#34d399"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- flecha búsqueda -> resultados -->
  <path d="M348 126 L348 152" stroke="#34d399" stroke-width="3" marker-end="url(#arrB)"/>
  <defs><marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/></marker></defs>

  <!-- ═══ RESULTADO 1 ═══ -->
  <g>
    <rect x="48" y="166" width="600" height="82" rx="12" fill="#11151f" stroke="#232c3d" stroke-width="1.5"/>
    <rect x="48" y="166" width="4" height="82" rx="2" fill="#34d399"/>
    <text x="70" y="192" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#eaf0fa">Apuntes de Aprendizaje Automático</text>
    <text x="296" y="192" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8">pág. 2</text>
    <rect x="480" y="178" width="152" height="19" rx="9.5" fill="none" stroke="#34d399" stroke-width="1"/>
    <text x="492" y="192" font-family="ui-monospace,monospace" font-size="11" fill="#34d399">Muy relevante · 0.912</text>
    <text x="70" y="216" font-family="system-ui,sans-serif" font-size="13" fill="#cfd8e6">El</text>
    <rect x="86" y="204" width="94" height="17" rx="3" fill="#34d399" opacity=".28"/>
    <text x="91" y="216" font-family="system-ui,sans-serif" font-size="13" fill="#eaf0fa">sobreajuste</text>
    <text x="186" y="216" font-family="system-ui,sans-serif" font-size="13" fill="#cfd8e6">aparece cuando el modelo memoriza el ruido</text>
    <text x="70" y="236" font-family="system-ui,sans-serif" font-size="13" fill="#cfd8e6">concreto del conjunto de entrenamiento en lugar del patrón…</text>
  </g>

  <!-- ═══ RESULTADO 2 ═══ -->
  <g>
    <rect x="48" y="260" width="600" height="62" rx="12" fill="#11151f" stroke="#232c3d" stroke-width="1.5"/>
    <rect x="48" y="260" width="4" height="62" rx="2" fill="#60a5fa"/>
    <text x="70" y="286" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#eaf0fa">Apuntes de Aprendizaje Automático</text>
    <text x="296" y="286" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8">pág. 2</text>
    <rect x="504" y="272" width="128" height="19" rx="9.5" fill="none" stroke="#60a5fa" stroke-width="1"/>
    <text x="516" y="286" font-family="ui-monospace,monospace" font-size="11" fill="#60a5fa">Relevante · 0.867</text>
    <text x="70" y="308" font-family="system-ui,sans-serif" font-size="13" fill="#cfd8e6">…regularización, aumento de datos, dropout y parada temprana…</text>
  </g>

  <!-- ═══ RESULTADO 3 ═══ -->
  <g opacity=".55">
    <rect x="48" y="334" width="600" height="38" rx="12" fill="#11151f" stroke="#232c3d" stroke-width="1.5"/>
    <rect x="48" y="334" width="4" height="38" rx="2" fill="#94a3b8"/>
    <text x="70" y="358" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8">…compromiso entre sesgo y varianza…</text>
    <text x="540" y="358" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8">pág. 2 · 0.841</text>
  </g>

  <!-- ═══ INSIGNIAS ═══ -->
  <g>
    <rect x="48" y="392" width="248" height="30" rx="15" fill="#34d399" opacity=".14" stroke="#34d399" stroke-width="1.2"/>
    <g stroke="#34d399" stroke-width="1.8" fill="none" stroke-linecap="round" transform="translate(66,400)">
      <rect x="0" y="5.5" width="12" height="8.5" rx="1.5"/><path d="M3 5.5V3.5a3 3 0 0 1 6 0v2"/>
    </g>
    <text x="90" y="412" font-family="system-ui,sans-serif" font-size="13" fill="#6ee7b7">100% en tu navegador · sin servidor</text>

    <rect x="308" y="392" width="180" height="30" rx="15" fill="#60a5fa" opacity=".14" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="326" y="412" font-family="ui-monospace,monospace" font-size="12" fill="#93c5fd">384 dims · coseno</text>

    <rect x="500" y="392" width="148" height="30" rx="15" fill="#a78bfa" opacity=".14" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="518" y="412" font-family="ui-monospace,monospace" font-size="12" fill="#c4b5fd">búsqueda en 18 ms</text>
  </g>
</svg>
