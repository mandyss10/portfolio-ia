<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Análisis de una fotografía de alimento con visión artificial y perfil de riesgo toxicológico">
  <defs>
    <linearGradient id="bgTox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08211f"/>
      <stop offset="55%" stop-color="#0d3330"/>
      <stop offset="100%" stop-color="#06181c"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowTox"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frameClip"><rect x="60" y="90" width="270" height="270" rx="16"/></clipPath>
  </defs>

  <rect width="800" height="450" fill="url(#bgTox)"/>

  <!-- ═══ IZQUIERDA: foto del alimento con escáner ═══ -->
  <g>
    <rect x="60" y="90" width="270" height="270" rx="16" fill="#0f2b28" stroke="#1d4d47" stroke-width="2"/>
    <g clip-path="url(#frameClip)">
      <!-- plato -->
      <ellipse cx="195" cy="245" rx="105" ry="72" fill="#123935"/>
      <ellipse cx="195" cy="240" rx="88" ry="58" fill="#164843"/>
      <!-- pescado -->
      <path d="M140 240 q38-34 82-6 q-6 20 0 32 q-46 22 -82 -8 z" fill="#f0a08a"/>
      <path d="M222 234 l26-16 l0 52 l-26-22 z" fill="#e07f68"/>
      <g stroke="#c96a55" stroke-width="2.5" opacity=".7">
        <path d="M158 240 q22-12 42 0"/><path d="M158 252 q22-10 42 2"/><path d="M158 264 q22-8 42 4"/>
      </g>
      <circle cx="156" cy="234" r="4" fill="#3d2a26"/>
      <!-- guarnición -->
      <circle cx="238" cy="272" r="12" fill="#4ea86a"/>
      <circle cx="252" cy="258" r="8" fill="#5fbf7c"/>
      <circle cx="146" cy="278" r="10" fill="#e8c25a"/>

      <!-- haz de escaneo -->
      <rect x="60" y="150" width="270" height="60" fill="url(#scanBeam)">
        <animate attributeName="y" values="90;300;90" dur="3.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- esquinas del visor -->
    <g stroke="#34d399" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M78 118 v-14 h14"/><path d="M312 118 v-14 h-14"/>
      <path d="M78 332 v14 h14"/><path d="M312 332 v14 h-14"/>
    </g>
    <!-- caja de detección -->
    <rect x="128" y="200" width="132" height="94" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="7 5"/>
    <rect x="128" y="180" width="118" height="20" fill="#34d399" rx="3"/>
    <text x="135" y="195" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#04231a">PESCADO · 94%</text>

    <text x="60" y="385" font-family="ui-monospace,monospace" font-size="13" fill="#6ee7b7">1 · Foto o cámara</text>
  </g>

  <!-- ═══ FLECHA / IA ═══ -->
  <g filter="url(#glowTox)">
    <path d="M348 225 L410 225" stroke="#34d399" stroke-width="3" marker-end="url(#arrTox)"/>
    <defs><marker id="arrTox" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/></marker></defs>
    <rect x="352" y="178" width="56" height="30" rx="15" fill="#0d3330" stroke="#34d399" stroke-width="1.5"/>
    <text x="362" y="198" font-family="ui-monospace,monospace" font-size="12" fill="#a7f3d0">IA</text>
    <circle cx="396" cy="193" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ═══ DERECHA: ficha de riesgo ═══ -->
  <g>
    <rect x="430" y="80" width="310" height="290" rx="16" fill="#0f2b28" stroke="#1d4d47" stroke-width="2"/>

    <text x="452" y="112" font-family="ui-monospace,monospace" font-size="11" fill="#5fae9d" letter-spacing="1.5">PERFIL TOXICOLÓGICO</text>

    <!-- toxina 1 -->
    <text x="452" y="142" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#eaf5f2">Mercurio (metilmercurio)</text>
    <rect x="452" y="152" width="266" height="9" rx="4.5" fill="#173f3a"/>
    <rect x="452" y="152" width="212" height="9" rx="4.5" fill="#f87171"/>
    <text x="686" y="145" font-family="ui-monospace,monospace" font-size="11" fill="#f87171">ALTO</text>

    <!-- toxina 2 -->
    <text x="452" y="192" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#eaf5f2">Histamina</text>
    <rect x="452" y="202" width="266" height="9" rx="4.5" fill="#173f3a"/>
    <rect x="452" y="202" width="146" height="9" rx="4.5" fill="#fbbf24"/>
    <text x="672" y="195" font-family="ui-monospace,monospace" font-size="11" fill="#fbbf24">MEDIO</text>

    <!-- toxina 3 -->
    <text x="452" y="242" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#eaf5f2">Dioxinas / PCB</text>
    <rect x="452" y="252" width="266" height="9" rx="4.5" fill="#173f3a"/>
    <rect x="452" y="252" width="82" height="9" rx="4.5" fill="#34d399"/>
    <text x="682" y="245" font-family="ui-monospace,monospace" font-size="11" fill="#34d399">BAJO</text>

    <!-- fuentes -->
    <line x1="452" y1="282" x2="718" y2="282" stroke="#1d4d47" stroke-width="1.5"/>
    <text x="452" y="304" font-family="ui-monospace,monospace" font-size="11" fill="#5fae9d">FUENTES CIENTÍFICAS</text>
    <g>
      <rect x="452" y="314" width="52" height="20" rx="10" fill="#34d399" opacity=".2" stroke="#34d399" stroke-width="1"/>
      <text x="462" y="328" font-family="ui-monospace,monospace" font-size="11" fill="#6ee7b7">EFSA</text>
      <rect x="512" y="314" width="46" height="20" rx="10" fill="#34d399" opacity=".2" stroke="#34d399" stroke-width="1"/>
      <text x="522" y="328" font-family="ui-monospace,monospace" font-size="11" fill="#6ee7b7">OMS</text>
      <rect x="566" y="314" width="54" height="20" rx="10" fill="#34d399" opacity=".2" stroke="#34d399" stroke-width="1"/>
      <text x="576" y="328" font-family="ui-monospace,monospace" font-size="11" fill="#6ee7b7">FDA</text>
    </g>

    <text x="430" y="395" font-family="ui-monospace,monospace" font-size="13" fill="#6ee7b7">2 · Perfil de riesgo con fuentes</text>
  </g>
</svg>
