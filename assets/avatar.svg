<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Retrato ilustrado con red neuronal de fondo">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="avBg" cx="50%" cy="35%">
      <stop offset="0%" stop-color="#1b3a44"/><stop offset="100%" stop-color="#0b1220"/>
    </radialGradient>
    <clipPath id="circleClip"><circle cx="200" cy="200" r="180"/></clipPath>
  </defs>

  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#ring)" stroke-width="4" opacity=".9"/>
  <g clip-path="url(#circleClip)">
    <circle cx="200" cy="200" r="180" fill="url(#avBg)"/>

    <!-- red neuronal de fondo -->
    <g stroke="#34d399" stroke-width="1" opacity=".22">
      <line x1="40" y1="90" x2="150" y2="150"/><line x1="40" y1="200" x2="150" y2="150"/>
      <line x1="40" y1="310" x2="150" y2="250"/><line x1="40" y1="200" x2="150" y2="250"/>
      <line x1="250" y1="150" x2="360" y2="90"/><line x1="250" y1="150" x2="360" y2="200"/>
      <line x1="250" y1="250" x2="360" y2="310"/><line x1="250" y1="250" x2="360" y2="200"/>
    </g>
    <g fill="#60a5fa" opacity=".45">
      <circle cx="40" cy="90" r="5"/><circle cx="40" cy="200" r="5"/><circle cx="40" cy="310" r="5"/>
      <circle cx="360" cy="90" r="5"/><circle cx="360" cy="200" r="5"/><circle cx="360" cy="310" r="5"/>
    </g>

    <!-- figura -->
    <g>
      <!-- hombros -->
      <path d="M92 400 C 100 310, 150 282, 200 282 C 250 282, 300 310, 308 400 Z" fill="#1f4d5a"/>
      <path d="M170 282 L200 320 L230 282 Z" fill="#163a45"/>
      <!-- cuello -->
      <rect x="180" y="238" width="40" height="60" rx="18" fill="#d9a488"/>
      <!-- cabeza -->
      <ellipse cx="200" cy="180" rx="66" ry="76" fill="#eec1a2"/>
      <!-- pelo -->
      <path d="M134 178 C 130 108, 175 92, 200 92 C 232 92, 272 112, 266 182 C 258 150, 250 136, 232 132 C 208 152, 168 150, 148 138 C 140 148, 136 162, 134 178 Z" fill="#2b2320"/>
      <!-- orejas -->
      <circle cx="134" cy="186" r="11" fill="#e0ac8c"/><circle cx="266" cy="186" r="11" fill="#e0ac8c"/>
      <!-- ojos -->
      <ellipse cx="176" cy="180" rx="7" ry="8" fill="#2b2320"/>
      <ellipse cx="224" cy="180" rx="7" ry="8" fill="#2b2320"/>
      <path d="M164 164 Q176 157 189 164" stroke="#2b2320" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M211 164 Q224 157 236 164" stroke="#2b2320" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- nariz y boca -->
      <path d="M200 190 L195 208 Q200 212 206 208" stroke="#c98d70" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M182 226 Q200 240 218 226" stroke="#a8624f" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#34d399" stroke-width="1" opacity=".3"/>
</svg>
