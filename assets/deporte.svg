<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" role="img" aria-label="Ilustración de un surfista en una ola al atardecer con un wingfoil en el horizonte">
  <defs>
    <linearGradient id="skyD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a52"/>
      <stop offset="45%" stop-color="#8b5a8c"/>
      <stop offset="72%" stop-color="#e08a63"/>
      <stop offset="100%" stop-color="#f6c177"/>
    </linearGradient>
    <linearGradient id="seaD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f4c6b"/>
      <stop offset="100%" stop-color="#062a44"/>
    </linearGradient>
    <linearGradient id="waveD" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5fd0e8"/>
      <stop offset="55%" stop-color="#1a7fa8"/>
      <stop offset="100%" stop-color="#0b4a68"/>
    </linearGradient>
    <linearGradient id="foamD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cdeef8"/>
    </linearGradient>
    <clipPath id="frameD"><rect width="700" height="520" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frameD)">
    <!-- cielo -->
    <rect width="700" height="330" fill="url(#skyD)"/>
    <circle cx="512" cy="272" r="52" fill="#ffd9a0" opacity=".95"/>
    <circle cx="512" cy="272" r="86" fill="#ffb877" opacity=".22"/>

    <!-- nubes -->
    <g fill="#ffffff" opacity=".18">
      <ellipse cx="150" cy="96" rx="76" ry="18"/>
      <ellipse cx="200" cy="84" rx="52" ry="14"/>
      <ellipse cx="580" cy="132" rx="64" ry="15"/>
    </g>

    <!-- mar -->
    <rect y="300" width="700" height="220" fill="url(#seaD)"/>
    <!-- reflejo del sol -->
    <g fill="#ffce8a" opacity=".35">
      <rect x="486" y="312" width="52" height="6" rx="3"/>
      <rect x="476" y="330" width="72" height="5" rx="2.5"/>
      <rect x="492" y="348" width="40" height="5" rx="2.5"/>
      <rect x="470" y="366" width="84" height="4" rx="2"/>
    </g>

    <!-- wingfoil en el horizonte -->
    <g transform="translate(148,268)">
      <path d="M0 0 q30 -34 62 -22 q-8 24 -30 34 z" fill="#34d399" opacity=".9"/>
      <path d="M0 0 q30 -34 62 -22" fill="none" stroke="#eafff7" stroke-width="2.5"/>
      <line x1="30" y1="12" x2="34" y2="34" stroke="#0e3547" stroke-width="3"/>
      <path d="M24 34 h22" stroke="#0e3547" stroke-width="3" stroke-linecap="round"/>
      <path d="M18 36 q16 6 34 0" stroke="#cdeef8" stroke-width="2.5" fill="none" opacity=".7"/>
    </g>

    <!-- ola principal -->
    <path d="M-40 520 C 40 470, 90 350, 210 330 C 330 310, 400 380, 470 420 C 540 460, 620 470, 740 452 L740 520 Z"
          fill="url(#waveD)"/>
    <!-- labio de la ola -->
    <path d="M210 330 C 300 314, 372 356, 430 396 C 372 368, 296 344, 216 356 C 206 348, 206 338, 210 330 Z"
          fill="url(#foamD)" opacity=".95"/>
    <path d="M-40 520 C 46 476, 96 366, 206 344" fill="none" stroke="#bfeaf7" stroke-width="5" opacity=".55"/>

    <!-- surfista -->
    <g transform="translate(292,352) rotate(-14)">
      <!-- tabla -->
      <ellipse cx="0" cy="46" rx="62" ry="9" fill="#f4f7fb"/>
      <ellipse cx="0" cy="46" rx="62" ry="9" fill="none" stroke="#34d399" stroke-width="2"/>
      <!-- piernas -->
      <path d="M-16 44 L-8 18 L6 20 L16 42" fill="none" stroke="#122a3d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- torso -->
      <path d="M-8 18 L2 -8" stroke="#122a3d" stroke-width="12" stroke-linecap="round"/>
      <!-- brazos -->
      <path d="M2 -6 L-26 -14" stroke="#122a3d" stroke-width="7" stroke-linecap="round"/>
      <path d="M2 -6 L26 -20" stroke="#122a3d" stroke-width="7" stroke-linecap="round"/>
      <!-- cabeza -->
      <circle cx="4" cy="-20" r="9" fill="#e0a882"/>
      <path d="M-4 -24 q8 -8 17 -2" fill="none" stroke="#2b2320" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- espuma delantera -->
    <g fill="#ffffff" opacity=".8">
      <circle cx="150" cy="470" r="7"/><circle cx="176" cy="484" r="5"/><circle cx="122" cy="492" r="6"/>
      <circle cx="470" cy="440" r="6"/><circle cx="498" cy="452" r="4.5"/>
    </g>
  </g>
</svg>
