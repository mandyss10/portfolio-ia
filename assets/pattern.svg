    <circle cx="120" cy="380" r="6"><animate attributeName="r" values="6;9;6" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="560" r="6"/>
    <circle cx="360" cy="120" r="7"/><circle cx="360" cy="300" r="7"><animate attributeName="r" values="7;11;7" dur="6s" repeatCount="indefinite"/></circle><circle cx="360" cy="480" r="7"/>
    <circle cx="640" cy="220" r="8"/><circle cx="640" cy="440" r="8"><animate attributeName="r" values="8;12;8" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="160" r="7"/><circle cx="920" cy="360" r="7"/><circle cx="920" cy="540" r="7"/>
    <circle cx="1120" cy="300" r="9"><animate attributeName="r" values="9;13;9" dur="5.5s" repeatCount="indefinite"/></circle>
