<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <radialGradient id="p1" cx="20%" cy="25%"><stop offset="0%" stop-color="#34d399" stop-opacity=".28"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="p2" cx="78%" cy="18%"><stop offset="0%" stop-color="#60a5fa" stop-opacity=".26"/><stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
    <radialGradient id="p3" cx="55%" cy="85%"><stop offset="0%" stop-color="#a78bfa" stop-opacity=".22"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#p1)"/>
  <rect width="1200" height="700" fill="url(#p2)"/>
  <rect width="1200" height="700" fill="url(#p3)"/>

  <!-- red neuronal -->
  <g stroke="#7dd3fc" stroke-width="1" opacity=".25">
    <line x1="120" y1="180" x2="360" y2="120"/><line x1="120" y1="180" x2="360" y2="300"/><line x1="120" y1="180" x2="360" y2="480"/>
    <line x1="120" y1="380" x2="360" y2="120"/><line x1="120" y1="380" x2="360" y2="300"/><line x1="120" y1="380" x2="360" y2="480"/>
    <line x1="120" y1="560" x2="360" y2="300"/><line x1="120" y1="560" x2="360" y2="480"/>
    <line x1="360" y1="120" x2="640" y2="220"/><line x1="360" y1="300" x2="640" y2="220"/><line x1="360" y1="300" x2="640" y2="440"/><line x1="360" y1="480" x2="640" y2="440"/>
    <line x1="640" y1="220" x2="920" y2="160"/><line x1="640" y1="220" x2="920" y2="360"/><line x1="640" y1="440" x2="920" y2="360"/><line x1="640" y1="440" x2="920" y2="540"/>
    <line x1="920" y1="160" x2="1120" y2="300"/><line x1="920" y1="360" x2="1120" y2="300"/><line x1="920" y1="540" x2="1120" y2="300"/>
