<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Visualización de datos genómicos y hélice de ADN">
  <defs>
    <linearGradient id="bgBio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="55%" stop-color="#10403b"/>
      <stop offset="100%" stop-color="#06201c"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glowBio"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgBio)"/>

  <!-- heatmap de expresión génica -->
  <g opacity="0.85">
    <g transform="translate(60,90)">
      <rect x="-10" y="-10" width="300" height="270" rx="10" fill="#ffffff" opacity="0.03"/>
      <g>
        <rect x="0"   y="0"   width="26" height="26" fill="#34d399" opacity=".95"/><rect x="30"  y="0"   width="26" height="26" fill="#60a5fa" opacity=".45"/><rect x="60"  y="0"   width="26" height="26" fill="#34d399" opacity=".30"/><rect x="90"  y="0"   width="26" height="26" fill="#f472b6" opacity=".70"/><rect x="120" y="0"   width="26" height="26" fill="#60a5fa" opacity=".85"/><rect x="150" y="0"   width="26" height="26" fill="#34d399" opacity=".55"/><rect x="180" y="0"   width="26" height="26" fill="#f472b6" opacity=".35"/><rect x="210" y="0"   width="26" height="26" fill="#60a5fa" opacity=".60"/><rect x="240" y="0"   width="26" height="26" fill="#34d399" opacity=".90"/>
        <rect x="0"   y="30"  width="26" height="26" fill="#60a5fa" opacity=".40"/><rect x="30"  y="30"  width="26" height="26" fill="#34d399" opacity=".88"/><rect x="60"  y="30"  width="26" height="26" fill="#f472b6" opacity=".62"/><rect x="90"  y="30"  width="26" height="26" fill="#34d399" opacity=".25"/><rect x="120" y="30"  width="26" height="26" fill="#60a5fa" opacity=".70"/><rect x="150" y="30"  width="26" height="26" fill="#34d399" opacity=".95"/><rect x="180" y="30"  width="26" height="26" fill="#60a5fa" opacity=".30"/><rect x="210" y="30"  width="26" height="26" fill="#f472b6" opacity=".80"/><rect x="240" y="30"  width="26" height="26" fill="#34d399" opacity=".45"/>
        <rect x="0"   y="60"  width="26" height="26" fill="#f472b6" opacity=".55"/><rect x="30"  y="60"  width="26" height="26" fill="#60a5fa" opacity=".92"/><rect x="60"  y="60"  width="26" height="26" fill="#34d399" opacity=".70"/><rect x="90"  y="60"  width="26" height="26" fill="#60a5fa" opacity=".35"/><rect x="120" y="60"  width="26" height="26" fill="#34d399" opacity=".60"/><rect x="150" y="60"  width="26" height="26" fill="#f472b6" opacity=".28"/><rect x="180" y="60"  width="26" height="26" fill="#34d399" opacity=".85"/><rect x="210" y="60"  width="26" height="26" fill="#60a5fa" opacity=".50"/><rect x="240" y="60"  width="26" height="26" fill="#34d399" opacity=".68"/>
        <rect x="0"   y="90"  width="26" height="26" fill="#34d399" opacity=".72"/><rect x="30"  y="90"  width="26" height="26" fill="#f472b6" opacity=".45"/><rect x="60"  y="90"  width="26" height="26" fill="#60a5fa" opacity=".88"/><rect x="90"  y="90"  width="26" height="26" fill="#34d399" opacity=".52"/><rect x="120" y="90"  width="26" height="26" fill="#60a5fa" opacity=".25"/><rect x="150" y="90"  width="26" height="26" fill="#34d399" opacity=".78"/><rect x="180" y="90"  width="26" height="26" fill="#f472b6" opacity=".66"/><rect x="210" y="90"  width="26" height="26" fill="#34d399" opacity=".38"/><rect x="240" y="90"  width="26" height="26" fill="#60a5fa" opacity=".82"/>
        <rect x="0"   y="120" width="26" height="26" fill="#60a5fa" opacity=".62"/><rect x="30"  y="120" width="26" height="26" fill="#34d399" opacity=".33"/><rect x="60"  y="120" width="26" height="26" fill="#34d399" opacity=".90"/><rect x="90"  y="120" width="26" height="26" fill="#f472b6" opacity=".58"/><rect x="120" y="120" width="26" height="26" fill="#60a5fa" opacity=".74"/><rect x="150" y="120" width="26" height="26" fill="#34d399" opacity=".42"/><rect x="180" y="120" width="26" height="26" fill="#60a5fa" opacity=".95"/><rect x="210" y="120" width="26" height="26" fill="#34d399" opacity=".64"/><rect x="240" y="120" width="26" height="26" fill="#f472b6" opacity=".30"/>
        <rect x="0"   y="150" width="26" height="26" fill="#34d399" opacity=".48"/><rect x="30"  y="150" width="26" height="26" fill="#60a5fa" opacity=".80"/><rect x="60"  y="150" width="26" height="26" fill="#f472b6" opacity=".40"/><rect x="90"  y="150" width="26" height="26" fill="#34d399" opacity=".92"/><rect x="120" y="150" width="26" height="26" fill="#34d399" opacity=".56"/><rect x="150" y="150" width="26" height="26" fill="#60a5fa" opacity=".68"/><rect x="180" y="150" width="26" height="26" fill="#34d399" opacity=".26"/><rect x="210" y="150" width="26" height="26" fill="#f472b6" opacity=".72"/><rect x="240" y="150" width="26" height="26" fill="#60a5fa" opacity=".44"/>
        <rect x="0"   y="180" width="26" height="26" fill="#f472b6" opacity=".65"/><rect x="30"  y="180" width="26" height="26" fill="#34d399" opacity=".58"/><rect x="60"  y="180" width="26" height="26" fill="#60a5fa" opacity=".36"/><rect x="90"  y="180" width="26" height="26" fill="#60a5fa" opacity=".84"/><rect x="120" y="180" width="26" height="26" fill="#34d399" opacity=".70"/><rect x="150" y="180" width="26" height="26" fill="#f472b6" opacity=".32"/><rect x="180" y="180" width="26" height="26" fill="#34d399" opacity=".88"/><rect x="210" y="180" width="26" height="26" fill="#60a5fa" opacity=".54"/><rect x="240" y="180" width="26" height="26" fill="#34d399" opacity=".76"/>
        <rect x="0"   y="210" width="26" height="26" fill="#60a5fa" opacity=".50"/><rect x="30"  y="210" width="26" height="26" fill="#34d399" opacity=".86"/><rect x="60"  y="210" width="26" height="26" fill="#34d399" opacity=".28"/><rect x="90"  y="210" width="26" height="26" fill="#f472b6" opacity=".62"/><rect x="120" y="210" width="26" height="26" fill="#60a5fa" opacity=".38"/><rect x="150" y="210" width="26" height="26" fill="#34d399" opacity=".94"/><rect x="180" y="210" width="26" height="26" fill="#60a5fa" opacity=".66"/><rect x="210" y="210" width="26" height="26" fill="#34d399" opacity=".46"/><rect x="240" y="210" width="26" height="26" fill="#f472b6" opacity=".78"/>
      </g>
    </g>
  </g>

  <!-- hélice de ADN -->
  <g transform="translate(560,225)" filter="url(#glowBio)">
    <path d="M-70,-180 C 30,-130 30,-70 -70,-20 C -170,30 -170,90 -70,140 C 30,190 30,210 -70,230"
          fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <path d="M70,-180 C -30,-130 -30,-70 70,-20 C 170,30 170,90 70,140 C -30,190 -30,210 70,230"
          fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <g stroke="#a7f3d0" stroke-width="3" opacity=".55">
      <line x1="-52" y1="-150" x2="52" y2="-150"/>
      <line x1="-4"  y1="-110" x2="4"  y2="-110"/>
      <line x1="-40" y1="-60"  x2="40" y2="-60"/>
      <line x1="-62" y1="-20"  x2="62" y2="-20"/>
      <line x1="-40" y1="30"   x2="40" y2="30"/>
      <line x1="-6"  y1="70"   x2="6"  y2="70"/>
      <line x1="-46" y1="110"  x2="46" y2="110"/>
      <line x1="-64" y1="150"  x2="64" y2="150"/>
      <line x1="-38" y1="195"  x2="38" y2="195"/>
    </g>
    <g fill="#e7fff6">
      <circle cx="-70" cy="-180" r="6"/><circle cx="70" cy="-180" r="6"/>
      <circle cx="-70" cy="-20" r="6"/><circle cx="70" cy="-20" r="6"/>
      <circle cx="-70" cy="140" r="6"/><circle cx="70" cy="140" r="6"/>
    </g>
  </g>

  <rect x="0" y="0" width="800" height="450" fill="none" stroke="url(#heat)" stroke-width="2" opacity=".35"/>
</svg>
