<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Detección de objetos con cajas delimitadoras en una escena urbana">
  <defs>
    <linearGradient id="bgVis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1a2e"/>
      <stop offset="60%" stop-color="#132a4a"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#0b1a2e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgVis)"/>
  <rect width="800" height="300" fill="url(#sky)"/>

  <!-- rejilla de perspectiva -->
  <g stroke="#60a5fa" stroke-width="1" opacity=".18">
    <line x1="0" y1="330" x2="800" y2="330"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="400" y1="300" x2="120" y2="450"/><line x1="400" y1="300" x2="260" y2="450"/>
    <line x1="400" y1="300" x2="400" y2="450"/><line x1="400" y1="300" x2="540" y2="450"/>
    <line x1="400" y1="300" x2="680" y2="450"/>
  </g>

  <!-- siluetas de edificios -->
  <g fill="#0e2137" opacity=".9">
    <rect x="40"  y="170" width="70"  height="160"/>
    <rect x="125" y="215" width="55"  height="115"/>
    <rect x="640" y="150" width="80"  height="180"/>
    <rect x="730" y="205" width="45"  height="125"/>
  </g>
  <g fill="#60a5fa" opacity=".35">
    <rect x="52" y="184" width="10" height="12"/><rect x="72" y="184" width="10" height="12"/><rect x="92" y="184" width="10" height="12"/>
    <rect x="52" y="210" width="10" height="12"/><rect x="92" y="210" width="10" height="12"/>
    <rect x="654" y="166" width="12" height="14"/><rect x="680" y="166" width="12" height="14"/>
    <rect x="654" y="196" width="12" height="14"/><rect x="694" y="196" width="12" height="14"/>
  </g>

  <!-- objetos detectados -->
  <g>
    <!-- persona -->
    <g fill="#1c3b5e">
      <circle cx="215" cy="255" r="16"/>
      <rect x="199" y="278" width="32" height="62" rx="12"/>
      <rect x="203" y="336" width="10" height="44" rx="5"/>
      <rect x="217" y="336" width="10" height="44" rx="5"/>
    </g>
    <rect x="184" y="232" width="62" height="158" fill="none" stroke="#34d399" stroke-width="3" rx="3"/>
    <rect x="184" y="212" width="102" height="21" fill="#34d399" rx="3"/>
    <text x="191" y="227" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#06251a">person 0.98</text>

    <!-- coche -->
    <g fill="#1c3b5e">
      <rect x="360" y="290" width="150" height="46" rx="12"/>
      <path d="M382 290 L402 262 L470 262 L490 290 Z"/>
      <circle cx="396" cy="340" r="16" fill="#15304d"/>
      <circle cx="476" cy="340" r="16" fill="#15304d"/>
    </g>
    <rect x="350" y="250" width="172" height="110" fill="none" stroke="#60a5fa" stroke-width="3" rx="3"/>
    <rect x="350" y="230" width="86" height="21" fill="#60a5fa" rx="3"/>
    <text x="357" y="245" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#06182e">car 0.94</text>

    <!-- bici -->
    <g fill="none" stroke="#1c3b5e" stroke-width="6">
      <circle cx="595" cy="330" r="24"/><circle cx="662" cy="330" r="24"/>
      <path d="M595 330 L622 296 L662 330 M622 296 L640 296"/>
    </g>
    <rect x="562" y="272" width="128" height="86" fill="none" stroke="#f472b6" stroke-width="3" rx="3"/>
    <rect x="562" y="252" width="106" height="21" fill="#f472b6" rx="3"/>
    <text x="569" y="267" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#3b0723">bicycle 0.89</text>
  </g>

  <!-- HUD -->
  <g opacity=".8">
    <rect x="24" y="24" width="150" height="30" rx="15" fill="#0b1a2e" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="44" cy="39" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="58" y="44" font-family="ui-monospace,monospace" font-size="13" fill="#a7f3d0">62 FPS · GPU</text>
  </g>
</svg>
