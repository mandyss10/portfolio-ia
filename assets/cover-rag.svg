<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Sistema RAG: documentos, base vectorial y respuesta citada">
  <defs>
    <linearGradient id="bgRag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="55%" stop-color="#241a4d"/>
      <stop offset="100%" stop-color="#120b24"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glowRag"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgRag)"/>

  <!-- 1. documentos -->
  <g transform="translate(50,120)">
    <rect x="24" y="24" width="120" height="155" rx="8" fill="#2e2159" opacity=".55"/>
    <rect x="12" y="12" width="120" height="155" rx="8" fill="#382a68" opacity=".75"/>
    <rect x="0"  y="0"  width="120" height="155" rx="8" fill="#efeaff"/>
    <g fill="#8b7fc7">
      <rect x="16" y="20" width="70" height="8" rx="4"/>
      <rect x="16" y="40" width="88" height="6" rx="3"/>
      <rect x="16" y="54" width="88" height="6" rx="3"/>
      <rect x="16" y="68" width="60" height="6" rx="3"/>
      <rect x="16" y="88" width="88" height="6" rx="3"/>
      <rect x="16" y="102" width="76" height="6" rx="3"/>
      <rect x="16" y="122" width="88" height="6" rx="3"/>
      <rect x="16" y="136" width="46" height="6" rx="3"/>
    </g>
    <text x="0" y="192" font-family="ui-monospace,monospace" font-size="14" fill="#c4b5fd">1 · Documentos</text>
  </g>

  <!-- flecha -->
  <path d="M195 195 L275 195" stroke="url(#flow)" stroke-width="3" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/></marker></defs>

  <!-- 2. espacio vectorial -->
  <g transform="translate(290,110)" filter="url(#glowRag)">
    <rect x="0" y="0" width="200" height="175" rx="12" fill="#ffffff" opacity=".05" stroke="#a78bfa" stroke-width="1.5"/>
    <g stroke="#a78bfa" stroke-width="1" opacity=".35">
      <line x1="20" y1="45" x2="180" y2="45"/><line x1="20" y1="88" x2="180" y2="88"/><line x1="20" y1="131" x2="180" y2="131"/>
      <line x1="60" y1="15" x2="60" y2="160"/><line x1="100" y1="15" x2="100" y2="160"/><line x1="140" y1="15" x2="140" y2="160"/>
    </g>
    <g fill="#c4b5fd" opacity=".8">
      <circle cx="45" cy="60" r="5"/><circle cx="78" cy="38" r="4"/><circle cx="120" cy="70" r="5"/>
      <circle cx="155" cy="52" r="4"/><circle cx="52" cy="118" r="4"/><circle cx="92" cy="142" r="5"/>
      <circle cx="132" cy="120" r="4"/><circle cx="168" cy="140" r="5"/><circle cx="30" cy="88" r="4"/>
    </g>
    <!-- vecinos más cercanos -->
    <circle cx="100" cy="88" r="34" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 5">
      <animateTransform attributeName="transform" type="rotate" from="0 100 88" to="360 100 88" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="88" r="7" fill="#34d399"/>
    <g stroke="#34d399" stroke-width="1.5" opacity=".8">
      <line x1="100" y1="88" x2="120" y2="70"/><line x1="100" y1="88" x2="78" y2="38"/><line x1="100" y1="88" x2="92" y2="142"/>
    </g>
    <text x="0" y="202" font-family="ui-monospace,monospace" font-size="14" fill="#c4b5fd">2 · Embeddings</text>
  </g>

  <path d="M510 195 L580 195" stroke="url(#flow)" stroke-width="3" marker-end="url(#a1)"/>

  <!-- 3. respuesta citada -->
  <g transform="translate(596,105)">
    <rect x="0" y="0" width="170" height="66" rx="14" fill="#a78bfa" opacity=".22" stroke="#a78bfa" stroke-width="1.5"/>
    <g fill="#ddd6fe"><rect x="16" y="20" width="112" height="7" rx="3.5"/><rect x="16" y="38" width="76" height="7" rx="3.5"/></g>
    <text x="16" y="14" font-family="ui-monospace,monospace" font-size="10" fill="#a78bfa">PREGUNTA</text>

    <rect x="0" y="84" width="170" height="100" rx="14" fill="#34d399" opacity=".15" stroke="#34d399" stroke-width="1.5"/>
    <g fill="#a7f3d0"><rect x="16" y="106" width="128" height="7" rx="3.5"/><rect x="16" y="122" width="112" height="7" rx="3.5"/><rect x="16" y="138" width="90" height="7" rx="3.5"/></g>
    <g><rect x="16" y="156" width="46" height="16" rx="8" fill="#34d399"/><text x="24" y="168" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#06251a">[1]</text>
       <rect x="68" y="156" width="46" height="16" rx="8" fill="#34d399" opacity=".7"/><text x="76" y="168" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#06251a">[2]</text></g>
    <text x="0" y="207" font-family="ui-monospace,monospace" font-size="14" fill="#6ee7b7">3 · Respuesta citada</text>
  </g>
</svg>
