<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Detección de un barco en el mar y clasificación en dos etapas entre atracado y navegando">
  <defs>
    <linearGradient id="skyS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f3d"/>
      <stop offset="70%" stop-color="#1b3f6b"/>
      <stop offset="100%" stop-color="#2b5c8a"/>
    </linearGradient>
    <linearGradient id="seaS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12507a"/>
      <stop offset="100%" stop-color="#062338"/>
    </linearGradient>
    <clipPath id="photoClip"><rect x="46" y="70" width="330" height="240" rx="14"/></clipPath>
  </defs>

  <rect width="800" height="450" fill="#071523"/>

  <!-- ═══ ETAPA 0: la foto de entrada ═══ -->
  <g>
    <g clip-path="url(#photoClip)">
      <rect x="46" y="70" width="330" height="240" fill="url(#skyS)"/>
      <rect x="46" y="215" width="330" height="95" fill="url(#seaS)"/>

      <!-- sol / bruma -->
      <circle cx="320" cy="120" r="26" fill="#f6d08a" opacity=".25"/>

      <!-- grúas de puerto al fondo -->
      <g stroke="#0b2c47" stroke-width="4" fill="none" opacity=".85">
        <path d="M70 215 v-58 h34"/><path d="M86 157 l0 -12"/>
        <path d="M126 215 v-46 h28"/>
      </g>

      <!-- barco -->
      <g>
        <path d="M150 215 l14 24 h124 l14 -24 z" fill="#123c56"/>
        <rect x="150" y="196" width="152" height="20" fill="#1b5273"/>
        <rect x="172" y="170" width="44" height="27" fill="#e6edf5"/>
        <rect x="180" y="176" width="8" height="8" fill="#2b5c8a"/>
        <rect x="192" y="176" width="8" height="8" fill="#2b5c8a"/>
        <rect x="204" y="176" width="8" height="8" fill="#2b5c8a"/>
        <rect x="228" y="180" width="18" height="17" fill="#c8d6e4"/>
        <rect x="252" y="184" width="14" height="13" fill="#c8d6e4"/>
        <rect x="188" y="150" width="9" height="21" fill="#d3453a"/>
        <path d="M197 152 h18 l-6 6 6 6 h-18 z" fill="#e7ecf5"/>
      </g>

      <!-- reflejo y olas -->
      <g stroke="#3d84b8" stroke-width="2.5" opacity=".5" stroke-linecap="round">
        <path d="M158 250 h56"/><path d="M232 250 h48"/>
        <path d="M120 268 h44"/><path d="M190 268 h70"/><path d="M282 268 h40"/>
        <path d="M96 288 h60"/><path d="M180 288 h52"/><path d="M258 288 h56"/>
      </g>
    </g>

    <rect x="46" y="70" width="330" height="240" rx="14" fill="none" stroke="#1e3a52" stroke-width="2"/>

    <!-- caja de detección -->
    <rect x="140" y="140" width="176" height="106" fill="none" stroke="#34d399" stroke-width="3"/>
    <rect x="140" y="120" width="122" height="21" fill="#34d399"/>
    <text x="147" y="135" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#04231a">BARCO · 93%</text>

    <text x="46" y="340" font-family="ui-monospace,monospace" font-size="13" fill="#7dd3fc">Imagen de entrada</text>
  </g>

  <!-- ═══ ETAPA 1 ═══ -->
  <g>
    <path d="M392 190 L432 190" stroke="#34d399" stroke-width="3" marker-end="url(#arrS)"/>
    <defs><marker id="arrS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#34d399"/></marker></defs>

    <rect x="444" y="86" width="300" height="88" rx="12" fill="#0d2438" stroke="#34d399" stroke-width="1.8"/>
    <text x="464" y="110" font-family="ui-monospace,monospace" font-size="11" fill="#34d399" letter-spacing="1.3">ETAPA 1 · AlexNet</text>
    <text x="464" y="134" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#eaf0fa">¿Hay un barco?</text>
    <rect x="464" y="145" width="200" height="8" rx="4" fill="#173347"/>
    <rect x="464" y="145" width="186" height="8" rx="4" fill="#34d399"/>
    <text x="676" y="153" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#34d399">93%</text>

    <!-- conexión entre etapas -->
    <path d="M594 174 L594 200" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrS2)"/>
    <defs><marker id="arrS2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#60a5fa"/></marker></defs>

    <!-- ═══ ETAPA 2 ═══ -->
    <rect x="444" y="208" width="300" height="88" rx="12" fill="#0d2438" stroke="#60a5fa" stroke-width="1.8"/>
    <text x="464" y="232" font-family="ui-monospace,monospace" font-size="11" fill="#60a5fa" letter-spacing="1.3">ETAPA 2 · ResNet18</text>
    <text x="464" y="256" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#eaf0fa">¿Atracado o navegando?</text>
    <rect x="464" y="267" width="200" height="8" rx="4" fill="#173347"/>
    <rect x="464" y="267" width="124" height="8" rx="4" fill="#60a5fa"/>
    <text x="676" y="275" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#60a5fa">62%</text>

    <!-- salidas -->
    <g>
      <rect x="444" y="318" width="140" height="34" rx="17" fill="#34d399" opacity=".16" stroke="#34d399" stroke-width="1.6"/>
      <text x="480" y="340" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#6ee7b7">ATRACADO</text>
      <rect x="604" y="318" width="140" height="34" rx="17" fill="#60a5fa" opacity=".16" stroke="#60a5fa" stroke-width="1.6"/>
      <text x="632" y="340" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#93c5fd">NAVEGANDO</text>
    </g>

    <text x="444" y="382" font-family="ui-monospace,monospace" font-size="13" fill="#7dd3fc">Pipeline en dos etapas · transfer learning</text>
  </g>
</svg>
